<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Buckle V2 — Internal Work Buddy Film (1920×1080 Landscape)</title>
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('../node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Geist';
      src: url('../node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Geist';
      src: url('../node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Geist';
      src: url('../node_modules/@fontsource/geist/files/geist-latin-700-normal.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #fdfdfb;
      color: #000000;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #fdfdfb;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }
    .scene.active {
      display: block;
    }

    /* Shared crisp macOS pointer arrow */
    #cursorLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 95;
    }
    #macCursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 32px;
      height: 39px;
      transform-origin: 4px 4px;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.22));
      display: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- ACT 1 (f0-114): F1 "Hi there, I'm Buckle." -> F2 Icons Orbit & Get Sucked Into Buckle -->
    <div id="act1" class="scene"></div>
    <!-- ACT 2 (f115-486): Continuous Workspace Evolution: F3 Line Draws Pill -> F4 Send Drops In -> F5 Greeting -> F6 Question & Click -> F7/F8 Zoom Out to Antigravity/Claude Chat UI -> F9 Buckle Drops & Thinks -> F10 3 Districts Answer -> F11 "Yes, Buckle :)" + Zoom Into Send -->
    <div id="act2" class="scene"></div>
    <!-- ACT 3 (f487-569): F12 "Meet your work buddy. Buckle." -> F13 Official BuckledIn Logo Close -->
    <div id="act3" class="scene"></div>

    <div id="cursorLayer">
      <svg id="macCursor" viewBox="0 0 32 39" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M3.5 2.5L3.5 31.2L10.7 24.4L15.6 35.4L20.1 33.4L15.3 22.5L25.4 22.5L3.5 2.5Z"
          fill="#000000"
          stroke="#FFFFFF"
          stroke-width="2.4"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>

  <script>
    (() => {
      // ── Deterministic Continuous Math Helpers ──
      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const easeLinear = (t) => clamp01(t);
      const easeInOut = (t) => { t = clamp01(t); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
      const easeOutCubic = (t) => 1 - Math.pow(1 - clamp01(t), 3);
      const easeInCubic = (t) => Math.pow(clamp01(t), 3);
      const easeOutExpo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp01(t)));
      const easeInExpo = (t) => (t <= 0 ? 0 : Math.pow(2, 10 * (clamp01(t) - 1)));
      const easeOutBack = (t) => { t = clamp01(t); const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

      function kf(f, keys, defaultEase = easeLinear) {
        if (f <= keys[0][0]) return keys[0][1];
        const last = keys[keys.length - 1];
        if (f >= last[0]) return last[1];
        for (let i = 0; i < keys.length - 1; i++) {
          const [f0, v0] = keys[i];
          const [f1, v1, segEase] = keys[i + 1];
          if (f >= f0 && f <= f1) {
            const p = (f - f0) / Math.max(1e-6, f1 - f0);
            const fn = segEase || defaultEase;
            return lerp(v0, v1, fn(p));
          }
        }
        return last[1];
      }

      function blinkPulse(f, center, half = 2.8) {
        const d = Math.abs(f - center);
        if (d >= half) return 1;
        const p = d / half;
        return lerp(0.08, 1, p * p * (3 - 2 * p));
      }

      // ── Exact Untouched Matte #0267CE Buckle SVG (THE signature blue hero!) ──
      const BEAN_L = [
        -2.3,-9.5,  1.2,-10.4,  4.8,-8.0,   6.0,-3.2,
         7.1, 1.5,  6.1,  8.6,  2.3, 9.5,
        -1.2,10.4, -4.8,  8.0, -6.0, 3.2,
        -7.1,-1.5, -6.1, -8.6, -2.3,-9.5,
      ];
      const BEAN_R = BEAN_L.map((v, i) => (i % 2 === 0 ? -v : v));
      const SMILE_ARC = [
         0.0,-7.4,   5.2,-7.4,   9.6,-3.2,   9.2, 2.2,
         8.9, 5.4,   5.6, 5.2,   0.0, 0.2,
        -5.6, 5.2,  -8.9, 5.4,  -9.2, 2.2,
        -9.6,-3.2,  -5.2,-7.4,   0.0,-7.4,
      ];
      const pathFrom = (a) =>
        `M ${a[0].toFixed(2)} ${a[1].toFixed(2)} ` +
        `C ${a[2].toFixed(2)} ${a[3].toFixed(2)}, ${a[4].toFixed(2)} ${a[5].toFixed(2)}, ${a[6].toFixed(2)} ${a[7].toFixed(2)} ` +
        `C ${a[8].toFixed(2)} ${a[9].toFixed(2)}, ${a[10].toFixed(2)} ${a[11].toFixed(2)}, ${a[12].toFixed(2)} ${a[13].toFixed(2)} ` +
        `C ${a[14].toFixed(2)} ${a[15].toFixed(2)}, ${a[16].toFixed(2)} ${a[17].toFixed(2)}, ${a[18].toFixed(2)} ${a[19].toFixed(2)} ` +
        `C ${a[20].toFixed(2)} ${a[21].toFixed(2)}, ${a[22].toFixed(2)} ${a[23].toFixed(2)}, ${a[24].toFixed(2)} ${a[25].toFixed(2)} Z`;

      function buckleSVG(id, size, opts = {}) {
        const {
          eyeX = 0, eyeY = 0, visorX = 0, visorY = 0,
          tilt = 0, sqX = 1, sqY = 1,
          blink = 1, smile = 0, shadow = true,
        } = opts;
        const mL = BEAN_L.map((v, i) => lerp(v, SMILE_ARC[i], smile));
        const mR = BEAN_R.map((v, i) => lerp(v, SMILE_ARC[i], smile));
        const exS = 1 + (1 - blink) * 0.14;

        return `
          <svg width="${size}" height="${size}" viewBox="0 0 240 240" overflow="visible" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="${id}-bg" cx="48%" cy="22%" r="78%" fx="48%" fy="18%">
                <stop offset="0%" stop-color="#2894F0" />
                <stop offset="32%" stop-color="#0C7EE6" />
                <stop offset="70%" stop-color="#0267CE" />
                <stop offset="100%" stop-color="#0353A8" />
              </radialGradient>
              <radialGradient id="${id}-rim" cx="50%" cy="12%" r="58%">
                <stop offset="0%" stop-color="#7CC5FB" stop-opacity="0.22" />
                <stop offset="65%" stop-color="#0E85EE" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="${id}-vis" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#1E8CEB" />
                <stop offset="22%" stop-color="#0A7CE3" />
                <stop offset="74%" stop-color="#0267CE" />
                <stop offset="100%" stop-color="#025DBD" />
              </linearGradient>
              <linearGradient id="${id}-hi" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#9BD4FC" stop-opacity="0.34" />
                <stop offset="45%" stop-color="#38A4F8" stop-opacity="0.1" />
                <stop offset="100%" stop-color="#0267CE" stop-opacity="0" />
              </linearGradient>
              <filter id="${id}-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6" /></filter>
              <linearGradient id="${id}-cav" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#0351A6" />
                <stop offset="36%" stop-color="#025EBE" />
                <stop offset="78%" stop-color="#066FD6" />
                <stop offset="100%" stop-color="#0C7FE8" />
              </linearGradient>
              <filter id="${id}-vsh" x="-20%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="6.5" flood-color="#042E63" flood-opacity="0.42" /></filter>
              <filter id="${id}-ish" x="-15%" y="-15%" width="130%" height="130%">
                <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0" /></feComponentTransfer>
                <feGaussianBlur stdDeviation="5.5" /><feOffset dx="0" dy="5" result="ob" />
                <feFlood flood-color="#042B5E" flood-opacity="0.46" result="c" />
                <feComposite in2="ob" operator="in" /><feComposite in2="SourceAlpha" operator="in" />
                <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode /></feMerge>
              </filter>
              <radialGradient id="${id}-gsh" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#0267CE" stop-opacity="0.2" />
                <stop offset="55%" stop-color="#0267CE" stop-opacity="0.07" />
                <stop offset="100%" stop-color="#0267CE" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="${id}-chk" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#7CC5FB" stop-opacity="0.48" />
                <stop offset="100%" stop-color="#7CC5FB" stop-opacity="0" />
              </radialGradient>
              <clipPath id="${id}-clip">
                <path d="M 120 28 C 174 28, 215 72, 215 129 C 215 178, 178 207.5, 120 207.5 C 62 207.5, 25 178, 25 129 C 25 72, 66 28, 120 28 Z" />
              </clipPath>
            </defs>
            ${shadow ? `<ellipse cx="120" cy="219" rx="64" ry="10" fill="url(#${id}-gsh)" />` : ''}
            <g transform="rotate(${tilt.toFixed(2)} 120 120) translate(120 190) scale(${sqX.toFixed(4)} ${sqY.toFixed(4)}) translate(-120 -190)">
              <path fill="url(#${id}-bg)" d="M 120 28 C 174 28, 215 72, 215 129 C 215 178, 178 207.5, 120 207.5 C 62 207.5, 25 178, 25 129 C 25 72, 66 28, 120 28 Z" />
              <path fill="url(#${id}-rim)" d="M 120 28 C 174 28, 215 72, 215 129 C 215 178, 178 207.5, 120 207.5 C 62 207.5, 25 178, 25 129 C 25 72, 66 28, 120 28 Z" />
              <g clip-path="url(#${id}-clip)">
                <g transform="translate(${visorX.toFixed(2)}, ${visorY.toFixed(2)})">
                  <path filter="url(#${id}-vsh)" fill="url(#${id}-vis)" d="M 20 124 C 20 82, 46 53, 76 56 C 97 58, 108 67, 120 67 C 132 67, 143 58, 164 56 C 194 53, 220 82, 220 124 C 220 153, 200 166, 168 166.5 L 72 166.5 C 40 166, 20 153, 20 124 Z" />
                  <path fill="none" filter="url(#${id}-blur)" stroke="url(#${id}-hi)" stroke-width="4.4" stroke-linecap="round" d="M 29 102 C 34 74, 52 57, 76 59 C 97 61, 108 69.5, 120 69.5 C 132 69.5, 143 61, 164 59 C 188 57, 206 74, 211 102" />
                  <g transform="translate(${(visorX * 0.24).toFixed(2)}, ${(visorY * 0.24).toFixed(2)})">
                    <path filter="url(#${id}-ish)" fill="url(#${id}-cav)" d="M 58 114 C 58 90, 70 78, 88 80 C 103 82, 111 91, 120 91 C 129 91, 137 82, 152 80 C 170 78, 182 90, 182 114 C 182 135, 169 145, 146 145 L 94 145 C 71 145, 58 135, 58 114 Z" />
                    ${smile > 0.02 ? `<g opacity="${(smile * 0.85).toFixed(3)}"><ellipse cx="86" cy="129" rx="13" ry="7.5" fill="url(#${id}-chk)" /><ellipse cx="154" cy="129" rx="13" ry="7.5" fill="url(#${id}-chk)" /></g>` : ''}
                    <g transform="translate(${eyeX.toFixed(2)}, ${eyeY.toFixed(2)})">
                      <g transform="translate(103.7, 116.8) scale(${exS.toFixed(3)}, ${blink.toFixed(3)})"><path fill="#FFFFFF" d="${pathFrom(mL)}" /></g>
                      <g transform="translate(136.3, 116.8) scale(${exS.toFixed(3)}, ${blink.toFixed(3)})"><path fill="#FFFFFF" d="${pathFrom(mR)}" /></g>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </svg>
        `;
      }

      const macCursor = document.getElementById('macCursor');
      function setCursor(visible, x = 0, y = 0, rot = 0, scale = 1) {
        if (!visible) { macCursor.style.display = 'none'; return; }
        macCursor.style.display = 'block';
        macCursor.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
      }

      // ───────────────────────────────────────────────────────────────
      // ACT 1 (f0–114): F1 "Hi there, I'm Buckle." -> F2 Icons Orbit & Get Sucked Into Buckle
      // Pure monochrome black typography + neutral white/black icon tiles -> Buckle is THE blue hero!
      // ───────────────────────────────────────────────────────────────
      const INTRO_STR = "Hi there, I'm Buckle.";
      const act1 = document.getElementById('act1');
      act1.innerHTML = `
        <div style="position:absolute; inset:0; background:#FDFDFB;">
          <!-- F1 Opening Typography (Pure Black Geist) -->
          <div id="a1Intro" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; z-index:4;">
            <div style="font-size:86px; font-weight:600; letter-spacing:-0.038em; line-height:1.06; color:#000000; margin-top:174px; white-space:nowrap;">
              <span id="a1Typed"></span><span id="a1Caret" style="display:inline-block; width:3.6px; height:64px; border-radius:2px; background:#000000; vertical-align:-9px; margin-left:6px;"></span>
            </div>
            <div id="a1Sub" style="margin-top:16px; font-size:24px; font-weight:400; color:#6B7280; letter-spacing:-0.015em; opacity:0;">
              Your team’s internal assistant
            </div>
          </div>

          <!-- F2 Subtle Neutral Halo behind Buckle -->
          <div id="a1Halo" style="position:absolute; left:960px; top:540px; border-radius:999px; background:#F0F0EE; transform:translate(-50%,-50%); opacity:0; z-index:2;"></div>

          <!-- F2 Four Monochrome Crisp Icon Tiles (Maps, Chat, Notifications, Safety Check) that orbit & get sucked INTO Buckle! -->
          <div id="a1Sq0" style="position:absolute; width:92px; height:92px; border-radius:26px; background:#FFFFFF; border:1.5px solid #E5E7EB; box-shadow:0 14px 30px -12px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; opacity:0; z-index:5;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 7 11.5 7.4 11.8a1 1 0 0 0 1.2 0C13 21.5 20 15.4 20 10a8 8 0 0 0-8-8Z"/></svg>
          </div>
          <div id="a1Sq1" style="position:absolute; width:92px; height:92px; border-radius:26px; background:#FFFFFF; border:1.5px solid #E5E7EB; box-shadow:0 14px 30px -12px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; opacity:0; z-index:5;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
          </div>
          <div id="a1Sq2" style="position:absolute; width:92px; height:92px; border-radius:26px; background:#FFFFFF; border:1.5px solid #E5E7EB; box-shadow:0 14px 30px -12px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; opacity:0; z-index:5;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div id="a1Sq3" style="position:absolute; width:92px; height:92px; border-radius:26px; background:#FFFFFF; border:1.5px solid #E5E7EB; box-shadow:0 14px 30px -12px rgba(0,0,0,0.12); display:flex; align-items:center; justify-content:center; opacity:0; z-index:5;">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          </div>

          <!-- Hero Buckle Actor (THE blue pop!) -->
          <div id="a1Buckle" style="position:absolute; left:960px; top:424px; transform:translate(-50%,-50%); z-index:10;"></div>
        </div>
      `;

      const a1Intro = document.getElementById('a1Intro');
      const a1Typed = document.getElementById('a1Typed');
      const a1Caret = document.getElementById('a1Caret');
      const a1Sub = document.getElementById('a1Sub');
      const a1Halo = document.getElementById('a1Halo');
      const a1Buckle = document.getElementById('a1Buckle');
      const a1Sqs = [0, 1, 2, 3].map((i) => document.getElementById(`a1Sq${i}`));

      function renderAct1(f) {
        setCursor(false);

        // F1: "Hi there, I'm Buckle." types f4..34, exits cleanly upward f50..64
        const charN = f < 4 ? 0 : Math.min(INTRO_STR.length, Math.round(clamp01((f - 4) / 30) * INTRO_STR.length));
        a1Typed.textContent = INTRO_STR.slice(0, charN);
        a1Caret.style.opacity = f >= 2 && f < 48 ? '1' : '0';
        const subIn = easeOutCubic(clamp01((f - 32) / 12));
        a1Sub.style.opacity = subIn.toFixed(3);
        a1Sub.style.transform = `translateY(${lerp(14, 0, subIn).toFixed(1)}px)`;

        const introOut = easeInExpo(clamp01((f - 50) / 14));
        a1Intro.style.opacity = (1 - introOut).toFixed(3);
        a1Intro.style.transform = `translateY(${(-introOut * 90).toFixed(1)}px)`;
        a1Intro.style.filter = introOut > 0.02 ? `blur(${(introOut * 10).toFixed(1)}px)` : 'none';

        // Buckle position & scale:
        // f0..54: bounces happily above "Hi there, I'm Buckle." at y=424 (172px)
        // f54..72: glides smoothly down to dead center y=540 (186px) for F2 Orbit!
        // f88..108: icons spiral & get SUCKED INTO Buckle -> Buckle swells happily on absorption (1.12x) -> glides up to y=350 (126px) by f114 ready for F3!
        let by = 424, bSize = 172, bOp = 1, sqX = 1, sqY = 1, tilt = 0, eyeX = 0, eyeY = 0, smile = 0;

        if (f < 54) {
          bOp = clamp01((f - 10) / 7);
          const dropP = easeOutBack(clamp01((f - 10) / 18));
          let hopY = 0;
          if (f >= 30 && f <= 48) {
            const hp = (f - 30) / 18;
            hopY = -Math.sin(hp * Math.PI) * 28;
            sqX = 1 - Math.sin(hp * Math.PI) * 0.03;
            sqY = 1 + Math.sin(hp * Math.PI) * 0.035;
            tilt = Math.sin(hp * Math.PI) * 4.2;
          }
          by = lerp(250, 424, dropP) + hopY;
          smile = f >= 30 && f <= 50 ? Math.sin(clamp01((f - 30) / 20) * Math.PI) * 0.88 : 0;
        } else {
          by = kf(f, [[54, 424], [70, 540, easeInOut], [105, 540], [114, 344, easeInOut]]);
          bSize = kf(f, [[54, 172], [70, 192, easeInOut], [98, 192], [106, 214, easeOutBack], [114, 126, easeInOut]]);
          // Curious eye sweep tracking orbiting icons f68..96
          if (f >= 66 && f <= 100) {
            const sp = clamp01((f - 66) / 30);
            const env = Math.sin(sp * Math.PI);
            eyeX = Math.cos(sp * Math.PI * 2.2) * 7.5 * env;
            eyeY = -Math.sin(sp * Math.PI * 2.2) * 5.0 * env;
            tilt = eyeX * 0.45;
          }
          // Subtle delighted swell right as the 4 icons get absorbed into Buckle (f98..108)
          if (f >= 98 && f <= 110) {
            const ap = (f - 98) / 12;
            const pulse = Math.sin(ap * Math.PI);
            sqX = 1 + pulse * 0.08;
            sqY = 1 - pulse * 0.06;
          }
        }

        const blink = smile < 0.2 ? blinkPulse(f, 52, 2.6) * blinkPulse(f, 108, 2.6) : 1;
        a1Buckle.style.opacity = bOp.toFixed(3);
        a1Buckle.style.top = `${by.toFixed(1)}px`;
        a1Buckle.innerHTML = buckleSVG('a1b', Math.round(bSize), {
          eyeX, eyeY, visorX: eyeX * 0.55, visorY: eyeY * 0.55, tilt, sqX, sqY, blink, smile, shadow: true,
        });

        // Halo expands softly for F2 orbit (f62..106)
        const haloD = kf(f, [[62, 160], [78, 340, easeOutCubic], [94, 340], [108, 40, easeInCubic]]);
        const haloOp = kf(f, [[62, 0], [74, 1], [94, 1], [107, 0, easeInCubic]]);
        a1Halo.style.width = `${haloD.toFixed(1)}px`;
        a1Halo.style.height = `${haloD.toFixed(1)}px`;
        a1Halo.style.opacity = haloOp.toFixed(3);

        // 4 Monochrome Icons: enter orbiting (f65..86) -> spiral inward & get SUCKED INTO Buckle (f88..106)!
        const baseAngs = [Math.PI, -Math.PI / 2, 0, Math.PI / 2];
        const sqOp = kf(f, [[64, 0], [72, 1, easeOutCubic], [100, 1], [106, 0, easeInCubic]]);
        const orbitR = kf(f, [[64, 350], [80, 248, easeOutExpo], [88, 248], [106, 0, easeInExpo]]);

      function renderAct3(f) {
        setCursor(false);
        // F12 (f487..524): "Meet your work buddy. Buckle." with Happy Buckle (^ ^)
        const bIn = easeOutExpo(clamp01((f - 487) / 12));
        const bOut = easeInCubic(clamp01((f - 516) / 9));
        a3Buddy.style.opacity = (bIn * (1 - bOut)).toFixed(3);
        a3Buddy.style.transform = `translateY(${(lerp(40, 0, bIn) - bOut * 36).toFixed(1)}px) scale(${lerp(0.95, 1, bIn).toFixed(4)})`;
        a3Buddy.style.filter = bOut > 0.05 ? `blur(${(bOut * 10).toFixed(1)}px)` : 'none';

        let hopY = 0, sqX = 1, sqY = 1;
        if (f >= 492 && f <= 508) {
          const hp = (f - 492) / 16;
          hopY = -Math.sin(hp * Math.PI) * 24;
          sqX = 1 - Math.sin(hp * Math.PI) * 0.032;
          sqY = 1 + Math.sin(hp * Math.PI) * 0.036;
        }
        const sway = Math.sin((f - 490) * 0.28) * 3.5;
        a3BuckleSlot.style.transform = `translateY(${hopY.toFixed(1)}px)`;
        a3BuckleSlot.innerHTML = buckleSVG('a3b', 186, {
          smile: 0.95, tilt: sway, visorX: sway * 0.7, eyeX: sway * 0.5, sqX, sqY, shadow: true,
        });

        // F13 (f524..569): Official BuckledIn Logo Close
        const lIn = easeOutExpo(clamp01((f - 524) / 14));
        const lBlur = kf(f, [[524, 10], [534, 0, easeOutCubic]]);
        a3LogoClose.style.opacity = lIn.toFixed(3);
        a3LogoClose.style.transform = `scale(${lerp(0.92, 1.0, lIn).toFixed(4)})`;
        a3LogoClose.style.filter = lBlur > 0.1 ? `blur(${lBlur.toFixed(1)}px)` : 'none';
      }

      // ── Scene Registry (f0..f569 = 19.0s @ 29.97fps) ──
      const SCENES = [
        { el: act1, f0: 0,   f1: 114.999, render: renderAct1 },
        { el: act2, f0: 115, f1: 486.999, render: renderAct2 },
        { el: act3, f0: 487, f1: 570,     render: renderAct3 },
      ];

      window.TOTAL_FRAMES_30 = 570;
      window.seek = function seek(frame) {
        const f = Math.max(0, Math.min(569.5, Number(frame)));
        for (const s of SCENES) {
          const on = f >= s.f0 && f <= s.f1;
          s.el.classList.toggle('active', on);
          if (on) s.render(f);
        }
      };

      const qf = new URLSearchParams(location.search).get('f');
      window.seek(qf !== null ? Number(qf) : 38);
    })();
  </script>
